<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="auth-logo">📋</span>
      <h1>LeaveFlow</h1>
      <p>Smart leave management for modern teams</p>
    </div>
    <div class="features">
      <div class="feature"><span>✅</span> Apply for leaves instantly</div>
      <div class="feature"><span>⚡</span> Real-time approvals</div>
      <div class="feature"><span>👥</span> Team visibility for managers</div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account</p>
      </div>

      <div class="error-banner" *ngIf="error">
        <span>⚠️</span> {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="you@company.com"
              required
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter your password"
              required
              [disabled]="loading"
            />
            <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading" class="spinner-sm"></span>
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</div>
