<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="auth-logo">📋</span>
      <h1>Employee Leave System</h1>
      <p>Join your team on Employee Leave System</p>
    </div>
    <div class="features">
      <div class="feature"><span>🔐</span> Secure & private</div>
      <div class="feature"><span>🎯</span> Role-based access</div>
      <div class="feature"><span>🔔</span> Instant status updates</div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Fill in your details to get started</p>
      </div>

      <div class="error-banner" *ngIf="error"><span>⚠️</span> {{ error }}</div>
      <div class="success-banner" *ngIf="success"><span>✅</span> {{ success }}</div>

      <form (ngSubmit)="onSubmit()" #regForm="ngForm">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required [disabled]="loading" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" [(ngModel)]="email" name="email" placeholder="you@company.com" required [disabled]="loading" />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Min 6 characters" required [disabled]="loading" />
            <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁️' }}</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Department</label>
            <select [(ngModel)]="department" name="department" required [disabled]="loading">
              <option value="">Select dept.</option>
              <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
            </select>
          </div>

          <div class="form-group">
            <label>Role</label>
            <select [(ngModel)]="role" name="role" required [disabled]="loading">
              <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">Create Account</span>
          <span *ngIf="loading" class="spinner-sm"></span>
        </button>
      </form>

      <p class="auth-switch">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
